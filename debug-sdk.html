<!DOCTYPE html>
<html>
<head>
    <title>Debug Dash Platform SDK</title>
</head>
<body>
    <h1>Debug Dash Platform SDK</h1>
    <div id="output"></div>
    
    <script>
        function log(message) {
            const output = document.getElementById('output');
            output.innerHTML += '<p>' + message + '</p>';
            console.log(message);
        }
        
        // Wait for SDK to be injected
        setTimeout(() => {
            if (window.dashPlatformSDK) {
                log('✅ Dash Platform SDK found');
                log('Documents object: ' + JSON.stringify(Object.keys(window.dashPlatformSDK.documents || {})));
                
                // Try to inspect the query method
                if (window.dashPlatformSDK.documents?.query) {
                    log('✅ Query method exists');
                    log('Query method: ' + window.dashPlatformSDK.documents.query.toString());
                } else {
                    log('❌ Query method not found');
                }
                
                // Try to call query with minimal params to see what error we get
                const testContract = '9jf2T5mLuoEXN2r24w9Kd5MNtJUnoMoB7YtFQNRznem3';
                const testType = 'note';
                
                log('Attempting test query...');
                window.dashPlatformSDK.documents.query(testContract, testType, { where: [], limit: 1 })
                    .then(result => {
                        log('✅ Query successful: ' + JSON.stringify(result));
                    })
                    .catch(error => {
                        log('❌ Query error: ' + error.message);
                        log('Error details: ' + JSON.stringify(error, null, 2));
                    });
                
            } else {
                log('❌ Dash Platform SDK not found');
            }
        }, 1000);
    </script>
</body>
</html>
