<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extension Identity Debug</title>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
    .section {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
    }
    .log {
      background: white;
      padding: 15px;
      border-radius: 4px;
      margin: 10px 0;
      font-family: monospace;
      white-space: pre-wrap;
      border: 1px solid #ddd;
    }
    .error {
      background: #fee;
      border-color: #fcc;
    }
    .success {
      background: #efe;
      border-color: #cfc;
    }
    button {
      background: #5c6bc0;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #3f51b5;
    }
    code {
      background: #f0f0f0;
      padding: 2px 4px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h1>🔍 Extension Identity Debugger</h1>
  
  <div class="section">
    <h2>Test Configuration</h2>
    <p>
      <label>Identity ID: <input type="text" id="identityId" value="DcoJJ3W9JauwLD51vzNuXJ9vnaZT7mprVm7wbgVYifNq" style="width: 400px;"></label><br>
      <label>Contract ID: <input type="text" id="contractId" value="5TShWDTorV1TXXBsQ5Xo1zAzYt9w2LstgbcB8J4SKifF" style="width: 400px;"></label>
    </p>
  </div>

  <div class="section">
    <h2>Tests</h2>
    <button onclick="checkExtension()">1. Check Extension</button>
    <button onclick="testIdentityMethods()">2. Test Identity Methods</button>
    <button onclick="testDocumentOwnership()">3. Test Document Ownership</button>
    <button onclick="testSignatureDebug()">4. Debug Signature Process</button>
    <button onclick="clearLogs()">Clear All</button>
  </div>

  <div id="logs"></div>

  <script>
    function addLog(message, type = 'log') {
      const logsDiv = document.getElementById('logs');
      const logDiv = document.createElement('div');
      logDiv.className = `log ${type}`;
      const time = new Date().toTimeString().split(' ')[0];
      logDiv.textContent = `[${time}] ${message}`;
      logsDiv.appendChild(logDiv);
      console.log(message);
    }

    function clearLogs() {
      document.getElementById('logs').innerHTML = '';
    }

    async function checkExtension() {
      clearLogs();
      addLog('=== Checking Extension ===');
      
      if (!window.dashPlatformSDK) {
        addLog('❌ Extension not found!', 'error');
        return false;
      }
      
      addLog('✅ Extension found', 'success');
      
      const sdk = window.dashPlatformSDK;
      
      // Check all available methods
      const methods = {
        identities: Object.getOwnPropertyNames(sdk.identities || {}),
        documents: Object.getOwnPropertyNames(sdk.documents || {}),
        stateTransitions: Object.getOwnPropertyNames(sdk.stateTransitions || {}),
        signer: Object.getOwnPropertyNames(sdk.signer || {})
      };
      
      addLog('Available methods:');
      Object.entries(methods).forEach(([namespace, methodList]) => {
        addLog(`${namespace}: ${methodList.join(', ')}`);
      });
      
      return true;
    }

    async function testIdentityMethods() {
      addLog('\n=== Testing Identity Methods ===');
      
      const sdk = window.dashPlatformSDK;
      if (!sdk) {
        addLog('Extension not found!', 'error');
        return;
      }
      
      const identityId = document.getElementById('identityId').value;
      
      // Test various methods to understand identity handling
      const tests = [
        {
          name: 'getBalance',
          fn: async () => await sdk.identities.getBalance(identityId)
        },
        {
          name: 'getCurrentIdentity',
          fn: async () => await sdk.identities.getCurrentIdentity?.()
        },
        {
          name: 'getIdentities',
          fn: async () => await sdk.identities.getIdentities?.()
        },
        {
          name: 'getByIdentifier',
          fn: async () => await sdk.identities.getByIdentifier?.(identityId)
        }
      ];
      
      for (const test of tests) {
        try {
          const result = await test.fn();
          if (result !== undefined) {
            addLog(`✅ ${test.name}: ${JSON.stringify(result, null, 2)}`, 'success');
          } else {
            addLog(`⚠️ ${test.name}: Method not available or returned undefined`);
          }
        } catch (error) {
          addLog(`❌ ${test.name}: ${error.message}`, 'error');
        }
      }
    }

    async function testDocumentOwnership() {
      addLog('\n=== Testing Document Ownership ===');
      
      const sdk = window.dashPlatformSDK;
      if (!sdk) {
        addLog('Extension not found!', 'error');
        return;
      }
      
      const identityId = document.getElementById('identityId').value;
      const contractId = document.getElementById('contractId').value;
      
      try {
        // Create a test document
        addLog('Creating test document...');
        const doc = await sdk.documents.create(
          contractId,
          'note',
          { test: 'ownership-test', timestamp: Date.now() },
          identityId,
          1n  // Use a low nonce for testing
        );
        
        addLog('Document created, checking ownership...');
        
        // Check ownership
        if (doc.toJSON) {
          const docJson = doc.toJSON();
          addLog(`Document owner: ${docJson.$ownerId}`);
          addLog(`Expected owner: ${identityId}`);
          
          if (docJson.$ownerId === identityId) {
            addLog('✅ Ownership matches!', 'success');
          } else {
            addLog('❌ OWNERSHIP MISMATCH!', 'error');
            addLog('This is likely why signatures fail - the extension creates documents with a different owner', 'error');
          }
        }
        
        // Try creating state transition
        addLog('\nCreating state transition...');
        const st = await sdk.stateTransitions.documentsBatch.create(doc, 1n);
        
        if (st.toJSON) {
          const stJson = st.toJSON();
          addLog(`State transition owner: ${stJson.ownerId}`);
          addLog(`Expected owner: ${identityId}`);
          
          if (stJson.ownerId === identityId) {
            addLog('✅ State transition ownership matches!', 'success');
          } else {
            addLog('❌ STATE TRANSITION OWNERSHIP MISMATCH!', 'error');
          }
        }
        
      } catch (error) {
        addLog(`Error: ${error.message}`, 'error');
      }
    }

    async function testSignatureDebug() {
      addLog('\n=== Debugging Signature Process ===');
      
      const sdk = window.dashPlatformSDK;
      if (!sdk) {
        addLog('Extension not found!', 'error');
        return;
      }
      
      const identityId = document.getElementById('identityId').value;
      const contractId = document.getElementById('contractId').value;
      
      try {
        // Get fresh nonce
        const nonce = await sdk.identities.getIdentityContractNonce(identityId, contractId);
        addLog(`Current nonce: ${nonce}`);
        
        // Create minimal document
        const doc = await sdk.documents.create(
          contractId,
          'note',
          { message: `Debug test ${Date.now()}` },
          identityId,
          nonce + 1n
        );
        addLog('Document created');
        
        // Create state transition
        const st = await sdk.stateTransitions.documentsBatch.create(doc, nonce + 1n);
        addLog('State transition created');
        
        // Log detailed state transition info
        if (st.toJSON) {
          const stJson = st.toJSON();
          addLog('\nState transition details:');
          addLog(JSON.stringify(stJson, null, 2));
        }
        
        // Try to sign
        addLog('\nAttempting to sign...');
        try {
          await sdk.signer.signStateTransition(st);
          addLog('✅ Signing successful!', 'success');
          
          // Check if signature was added
          if (st.toJSON) {
            const stJsonAfter = st.toJSON();
            addLog(`Has signature after signing: ${!!stJsonAfter.signature}`);
            if (stJsonAfter.signature) {
              addLog(`Signature length: ${stJsonAfter.signature.length}`);
            }
          }
        } catch (signError) {
          addLog(`❌ Signing failed: ${signError.message}`, 'error');
          
          if (signError.message.includes('Signature is missing')) {
            addLog('\nPOSSIBLE CAUSES:', 'error');
            addLog('1. Extension doesn\'t have the private key for identity: ' + identityId, 'error');
            addLog('2. Extension is configured with a different identity', 'error');
            addLog('3. The state transition owner doesn\'t match the extension\'s identity', 'error');
            addLog('\nRECOMMENDED ACTION:', 'error');
            addLog('Check that the extension has imported the correct identity with its private key', 'error');
          }
        }
        
      } catch (error) {
        addLog(`Error: ${error.message}`, 'error');
      }
    }

    // Auto-check on load
    window.addEventListener('load', () => {
      setTimeout(checkExtension, 1000);
    });
  </script>
</body>
</html>
